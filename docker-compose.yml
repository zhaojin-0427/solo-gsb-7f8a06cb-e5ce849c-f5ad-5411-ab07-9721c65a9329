services:
  api:
    build: .
    # 宿主机端口:容器内端口（容器内固定监听 8000）。
    # 修改左侧端口即可更换宿主机访问端口，例如 "9000:8000"。
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
